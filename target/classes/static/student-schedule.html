<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的课表</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei"; background: #f0f2f5; padding: 20px; }
        .header {
            background: #1890ff; color: #fff; padding: 20px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-size: 20px; }
        .header a { color: #fff; text-decoration: none; margin-right: 15px; }

        .summary {
            margin-top: 20px; background: #fff; border-radius: 8px;
            padding: 20px; display: flex; gap: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .summary-item { flex: 1; }
        .summary-item .label { color: #999; font-size: 13px; margin-bottom: 8px; }
        .summary-item .value { color: #1890ff; font-size: 24px; font-weight: 600; }
        .summary-item .value small { font-size: 14px; color: #999; margin-left: 4px; }

        .schedule-wrapper {
            margin-top: 20px; background: #fff; border-radius: 8px;
            padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        table.schedule {
            width: 100%; border-collapse: collapse; table-layout: fixed;
        }
        table.schedule th {
            background: #1890ff; color: #fff; padding: 12px;
            font-weight: 600; border: 1px solid #e6f7ff;
        }
        table.schedule td {
            border: 1px solid #e8e8e8; height: 70px;
            padding: 6px; vertical-align: top; text-align: center;
        }
        td.section-label {
            background: #fafafa; font-weight: 600; color: #666;
            width: 80px; vertical-align: middle !important;
            text-align: center;
        }
        td.empty { background: #fcfcfc; }
        td.course-cell {
            background: linear-gradient(135deg, #e6f7ff, #bae7ff);
            border-radius: 6px;
        }
        .course-name { font-weight: 600; color: #0050b3; margin-bottom: 4px; font-size: 14px; }
        .course-info { font-size: 12px; color: #595959; line-height: 1.4; }

        .empty-tip {
            text-align: center; padding: 60px; color: #999;
            background: #fff; border-radius: 8px; margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📅 我的课表</h1>
    <div>
        <a href="/student.html">返回首页</a>
        <a href="/student-course.html">去选课</a>
        <a href="#" onclick="logout()">退出登录</a>
    </div>
</div>

<!-- 学分统计 -->
<div class="summary" id="summary" style="display:none;">
    <div class="summary-item">
        <div class="label">已选课程</div>
        <div class="value" id="courseCount">0<small>门</small></div>
    </div>
    <div class="summary-item">
        <div class="label">总学分</div>
        <div class="value" id="totalCredit">0<small>分</small></div>
    </div>
    <div class="summary-item">
        <div class="label">本周课时</div>
        <div class="value" id="totalSection">0<small>节</small></div>
    </div>
</div>

<!-- 课表 -->
<div class="schedule-wrapper" id="scheduleWrapper" style="display:none;">
    <table class="schedule">
        <thead>
        <tr>
            <th style="width:80px;">节次</th>
            <th>周一</th>
            <th>周二</th>
            <th>周三</th>
            <th>周四</th>
            <th>周五</th>
            <th>周六</th>
            <th>周日</th>
        </tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
    </table>
</div>

<div class="empty-tip" id="emptyTip" style="display:none;">
    😶 你还没有选择任何课程，去<a href="/student-course.html" style="color:#1890ff;">「选课」</a>页面选几门吧！
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login.html';
    }

    const MAX_SECTION = 6;   // 每天最多显示 6 节
    const MAX_DAY = 7;       // 周一 ~ 周日

    // 统一请求封装
    async function request(url, options = {}) {
        const res = await fetch(url, {
            ...options,
            headers: {
                'Authorization': 'Bearer ' + token,
                ...(options.headers || {})
            }
        });
        if (res.status === 401 || res.status === 403) {
            alert('登录已过期，请重新登录');
            localStorage.clear();
            window.location.href = '/login.html';
            throw new Error('未授权');
        }
        if (!res.ok) {
            const text = await res.text();
            console.error('请求失败:', url, res.status, text);
            throw new Error('服务器错误 ' + res.status);
        }
        return res.json();
    }

    async function loadSchedule() {
        try {
            const schedules = await request('/course/select/schedule');
            const emptyTip = document.getElementById('emptyTip');
            const wrapper = document.getElementById('scheduleWrapper');
            const summary = document.getElementById('summary');

            if (!schedules || schedules.length === 0) {
                emptyTip.style.display = 'block';
                wrapper.style.display = 'none';
                summary.style.display = 'none';
                return;
            }

            emptyTip.style.display = 'none';
            wrapper.style.display = 'block';
            summary.style.display = 'flex';

            // ===== 统计信息 =====
            const courseSet = new Set();
            let totalCredit = 0;
            let totalSection = 0;
            schedules.forEach(s => {
                if (!courseSet.has(s.courseId)) {
                    courseSet.add(s.courseId);
                    totalCredit += (s.credit || 0);
                }
                totalSection += (s.endSection - s.startSection + 1);
            });
            document.getElementById('courseCount').innerHTML = courseSet.size + '<small>门</small>';
            document.getElementById('totalCredit').innerHTML = totalCredit + '<small>分</small>';
            document.getElementById('totalSection').innerHTML = totalSection + '<small>节</small>';

            // ===== 建立格子索引 =====
            // grid[day][section] = schedule 对象（day: 1-7, section: 1-6）
            const grid = {};
            schedules.forEach(s => {
                for (let sec = s.startSection; sec <= s.endSection; sec++) {
                    grid[s.weekDay + '-' + sec] = s;
                }
            });

            // ===== 渲染表格 =====
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';

            for (let section = 1; section <= MAX_SECTION; section++) {
                let row = `<tr><td class="section-label">第${section}节</td>`;
                for (let day = 1; day <= MAX_DAY; day++) {
                    const s = grid[day + '-' + section];
                    if (!s) {
                        row += '<td class="empty"></td>';
                    } else if (s.startSection === section) {
                        // 只在起始节次渲染，用 rowspan 合并
                        const rowspan = s.endSection - s.startSection + 1;
                        row += `<td class="course-cell" rowspan="${rowspan}">
                            <div class="course-name">${s.courseName}</div>
                            <div class="course-info">👨‍🏫 ${s.teacherName || '-'}</div>
                            <div class="course-info">📍 ${s.location || '-'}</div>
                        </td>`;
                    }
                    // 否则跳过（被上一格 rowspan 覆盖）
                }
                row += '</tr>';
                tbody.innerHTML += row;
            }

        } catch (e) {
            console.error('加载课表失败:', e);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }

    loadSchedule();
</script>
</body>
</html>
