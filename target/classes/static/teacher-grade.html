<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei"; background: transparent; padding: 30px; color: #1f2937; }
        .summary { background: #fff; border-radius: 12px; padding: 24px; display: flex; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px; }
        .summary-item { flex: 1; text-align: center; border-right: 1px solid #f3f4f6; }
        .summary-item:last-child { border: none; }
        .summary-item .label { color: #6b7280; font-size: 13px; margin-bottom: 8px; }
        .summary-item .value { color: #10b981; font-size: 24px; font-weight: 600; }
        .summary-item .value small { font-size: 14px; color: #6b7280; margin-left: 4px; }
        .table-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px 24px; text-align: left; border-bottom: 1px solid #f3f4f6; }
        th { background: #f9fafb; color: #6b7280; font-size: 13px; font-weight: 600; text-transform: uppercase; }
        tr:hover { background-color: #f9fafb; }
        .score-input { width: 100px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; text-align: center; transition: all 0.2s; }
        .score-input:focus { border-color: #10b981; outline: none; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
        .btn-save { padding: 10px 20px; background: #10b981; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
        .btn-save:hover { background: #059669; }
        .btn-save:disabled { background: #a7f3d0; cursor: not-allowed; }
        .empty-tip { text-align: center; padding: 60px; color: #9ca3af; background: #fff; border-radius: 12px; }
    </style>
</head>
<body>
<div class="summary" id="summary" style="display:none;">
    <div class="summary-item"><div class="label">当前课程</div><div class="value" id="courseName" style="color:#1f2937;">-</div></div>
    <div class="summary-item"><div class="label">选课人数</div><div class="value" id="studentCount">0<small>人</small></div></div>
    <div class="summary-item"><div class="label">已录入成绩</div><div class="value" id="gradedCount">0<small>人</small></div></div>
</div>
<div class="table-container" id="tableWrap" style="display:none;">
    <table>
        <thead><tr><th>学号</th><th>姓名</th><th>当前成绩</th><th>操作</th></tr></thead>
        <tbody id="studentTable"></tbody>
    </table>
</div>
<div class="empty-tip" id="emptyTip" style="display:none;">😶 目前还没有学生选择这门课</div>
<script>
    const token = localStorage.getItem('token');
    const params = new URLSearchParams(window.location.search);
    const courseId = params.get('courseId');
    const courseName = params.get('courseName');
    if (!courseId) window.location.href = '/teacher-course.html';
    document.getElementById('courseName').innerText = courseName || '未知课程';

    async function request(url, options = {}) {
        const res = await fetch(url, { ...options, headers: { 'Authorization': 'Bearer ' + token, ...(options.headers || {}) } });
        if (!res.ok) throw new Error('服务器错误');
        return res.json();
    }
    async function loadStudents() {
        try {
            const students = await request('/teacher/students?courseId=' + courseId);
            document.getElementById('summary').style.display = 'flex';
            if (!students || students.length === 0) { document.getElementById('emptyTip').style.display = 'block'; return; }
            document.getElementById('tableWrap').style.display = 'block';
            let graded = 0;
            const tbody = document.getElementById('studentTable'); tbody.innerHTML = '';
            students.forEach(s => {
                const hasScore = s.score !== null && s.score !== undefined;
                if (hasScore) graded++;
                const scoreVal = hasScore ? parseFloat(s.score) : '';
                const inputId = `input-${s.studentId}`;
                tbody.innerHTML += `
                    <tr>
                        <td style="color:#6b7280;font-family:monospace;">${s.studentUsername}</td>
                        <td style="font-weight:500;">${s.studentName}</td>
                        <td><input type="number" class="score-input" id="${inputId}" value="${scoreVal}" min="0" max="100" step="0.1" placeholder="未录入"></td>
                        <td><button class="btn-save" onclick="saveScore(${s.studentId}, '${inputId}', this)">保存</button></td>
                    </tr>`;
            });
            document.getElementById('studentCount').innerHTML = students.length + '<small>人</small>';
            document.getElementById('gradedCount').innerHTML = graded + '<small>人</small>';
        } catch (e) { console.error(e); }
    }
    async function saveScore(studentId, inputId, btnObj) {
        const input = document.getElementById(inputId);
        const val = input.value.trim();
        if (val === '') return alert('请输入成绩');
        const scoreNum = parseFloat(val);
        if (isNaN(scoreNum) || scoreNum < 0 || scoreNum > 100) return alert('成绩必须在 0-100 之间');
        btnObj.disabled = true; btnObj.innerText = '保存中...';
        try {
            const res = await request('/teacher/grade', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ studentId, courseId, score: scoreNum })
            });
            if (res.success) { btnObj.innerText = '已保存'; btnObj.style.background = '#a7f3d0'; loadStudents(); }
            else { alert(res.message); btnObj.disabled = false; btnObj.innerText = '保存'; }
        } catch (e) { alert('保存失败'); btnObj.disabled = false; btnObj.innerText = '保存'; }
    }
    loadStudents();
</script>
</body>
</html>
