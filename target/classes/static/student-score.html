<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的成绩</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei"; background: #f0f2f5; padding: 20px; }
        .header {
            background: #1890ff; color: #fff; padding: 20px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-size: 20px; }
        .header a { color: #fff; text-decoration: none; margin-right: 15px; }

        .summary {
            margin-top: 20px; background: #fff; border-radius: 8px;
            padding: 20px; display: flex; gap: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .summary-item { flex: 1; text-align: center; }
        .summary-item .label { color: #999; font-size: 13px; margin-bottom: 8px; }
        .summary-item .value { color: #1890ff; font-size: 26px; font-weight: 600; }
        .summary-item .value small { font-size: 14px; color: #999; margin-left: 4px; }

        .table-wrap {
            margin-top: 20px; background: #fff; border-radius: 8px;
            overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; font-weight: 600; }
        tr:hover { background: #f5f5f5; }
        .score-num { font-weight: 600; font-size: 16px; }
        .score-pass { color: #52c41a; }
        .score-fail { color: #ff4d4f; }
        .tag {
            display: inline-block; padding: 2px 10px; border-radius: 4px;
            font-size: 12px; font-weight: 500;
        }
        .tag-pass { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .tag-fail { background: #fff1f0; color: #ff4d4f; border: 1px solid #ffccc7; }

        .empty-tip {
            text-align: center; padding: 60px; color: #999;
            background: #fff; border-radius: 8px; margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 我的成绩</h1>
    <div>
        <a href="/student.html">返回首页</a>
        <a href="#" onclick="logout()">退出登录</a>
    </div>
</div>

<!-- 统计卡片 -->
<div class="summary" id="summary" style="display:none;">
    <div class="summary-item">
        <div class="label">已修课程</div>
        <div class="value" id="courseCount">0<small>门</small></div>
    </div>
    <div class="summary-item">
        <div class="label">平均分</div>
        <div class="value" id="avgScore">0<small>分</small></div>
    </div>
    <div class="summary-item">
        <div class="label">最高分</div>
        <div class="value" id="maxScore">0<small>分</small></div>
    </div>
    <div class="summary-item">
        <div class="label">已获学分</div>
        <div class="value" id="totalCredit">0<small>分</small></div>
    </div>
</div>

<!-- 成绩表格 -->
<div class="table-wrap" id="tableWrap" style="display:none;">
    <table>
        <thead>
        <tr>
            <th>课程名</th>
            <th>教师</th>
            <th>学分</th>
            <th>分数</th>
            <th>状态</th>
        </tr>
        </thead>
        <tbody id="scoreTable"></tbody>
    </table>
</div>

<!-- 空状态 -->
<div class="empty-tip" id="emptyTip" style="display:none;">
    😶 你还没有任何成绩记录
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login.html';
    }

    // ============ 统一请求封装 ============
    async function request(url, options = {}) {
        const res = await fetch(url, {
            ...options,
            headers: {
                'Authorization': 'Bearer ' + token,
                ...(options.headers || {})
            }
        });
        if (res.status === 401 || res.status === 403) {
            alert('登录已过期，请重新登录');
            localStorage.clear();
            window.location.href = '/login.html';
            throw new Error('未授权');
        }
        if (!res.ok) {
            const text = await res.text();
            console.error('请求失败:', url, res.status, text);
            throw new Error('服务器错误 ' + res.status);
        }
        return res.json();
    }

    // ============ 加载成绩 ============
    async function loadScores() {
        try {
            const scores = await request('/score/my');
            const emptyTip = document.getElementById('emptyTip');
            const tableWrap = document.getElementById('tableWrap');
            const summary = document.getElementById('summary');

            if (!scores || scores.length === 0) {
                emptyTip.style.display = 'block';
                tableWrap.style.display = 'none';
                summary.style.display = 'none';
                return;
            }

            emptyTip.style.display = 'none';
            tableWrap.style.display = 'block';
            summary.style.display = 'flex';

            // ===== 统计 =====
            let total = 0;
            let maxScore = 0;
            let totalCredit = 0;
            scores.forEach(s => {
                const sc = parseFloat(s.score);
                total += sc;
                if (sc > maxScore) maxScore = sc;
                // 及格（>=60）才计入已获学分
                if (sc >= 60) totalCredit += (s.credit || 0);
            });
            const avg = (total / scores.length).toFixed(1);

            document.getElementById('courseCount').innerHTML = scores.length + '<small>门</small>';
            document.getElementById('avgScore').innerHTML = avg + '<small>分</small>';
            document.getElementById('maxScore').innerHTML = maxScore + '<small>分</small>';
            document.getElementById('totalCredit').innerHTML = totalCredit + '<small>分</small>';

            // ===== 表格 =====
            const tbody = document.getElementById('scoreTable');
            tbody.innerHTML = '';
            scores.forEach(s => {
                const sc = parseFloat(s.score);
                const pass = sc >= 60;
                tbody.innerHTML += `
                    <tr>
                        <td>${s.courseName}</td>
                        <td>${s.teacherName || '-'}</td>
                        <td>${s.credit}</td>
                        <td class="score-num ${pass ? 'score-pass' : 'score-fail'}">${sc}</td>
                        <td>
                            <span class="tag ${pass ? 'tag-pass' : 'tag-fail'}">
                                ${pass ? '及格' : '不及格'}
                            </span>
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error('加载成绩失败:', e);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }

    loadScores();
</script>
</body>
</html>
