<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理控制台 - 教务系统</title>
    <style>
        :root {
            --primary: #8b5cf6; /* 管理员紫 */
            --sidebar-bg: #ffffff;
            --bg-color: #f3f4f6;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --sidebar-width: 240px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); overflow: hidden; }

        .app-container { display: flex; height: 100vh; }
        .sidebar {
            width: var(--sidebar-width); background: var(--sidebar-bg);
            border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; z-index: 10;
        }
        .sidebar .logo {
            height: 64px; display: flex; align-items: center; padding: 0 24px;
            font-size: 20px; font-weight: 700; color: var(--primary); border-bottom: 1px solid #f3f4f6;
        }
        .sidebar .logo span { margin-left: 10px; }
        .menu-list { padding: 20px 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .menu-item {
            display: flex; align-items: center; padding: 12px 16px;
            color: var(--text-sub); text-decoration: none; border-radius: 8px;
            font-size: 15px; font-weight: 500; transition: all 0.2s ease; cursor: pointer; position: relative;
        }
        .menu-item:hover { background: #f8fafc; color: var(--text-main); }
        .menu-item.active { background: #f5f3ff; color: var(--primary); }
        .menu-item.active::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 4px; height: 20px; background: var(--primary); border-radius: 0 4px 4px 0;
        }
        .menu-icon { margin-right: 12px; font-size: 18px; }

        .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-header {
            height: 64px; background: #fff; border-bottom: 1px solid #e5e7eb;
            display: flex; justify-content: space-between; align-items: center; padding: 0 30px; flex-shrink: 0;
        }
        .breadcrumb { font-size: 14px; color: var(--text-sub); font-weight: 500; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .user-profile { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
        .avatar-small {
            width: 32px; height: 32px; border-radius: 50%;
            background: #f5f3ff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .btn-logout {
            background: transparent; border: 1px solid #e5e7eb; color: #ef4444;
            padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s;
        }
        .btn-logout:hover { background: #fef2f2; border-color: #fecaca; }

        .iframe-container { flex: 1; background: var(--bg-color); position: relative; }
        #mainFrame { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo">🛠️ <span>管理控制台</span></div>
        <div class="menu-list" id="menuList">
            <div class="menu-item active" data-url="/admin-home-content.html" data-title="系统概览 / 数据看板" onclick="loadPage(this)">
                <span class="menu-icon">📊</span> 数据看板
            </div>
            <div class="menu-item" data-url="/admin-user.html" data-title="系统管理 / 用户管理" onclick="loadPage(this)">
                <span class="menu-icon">👥</span> 用户管理
            </div>
            <div class="menu-item" data-url="/admin-course.html" data-title="教学管理 / 课程管理" onclick="loadPage(this)">
                <span class="menu-icon">📚</span> 课程管理
            </div>
            <div class="menu-item" data-url="/admin-profile.html" data-title="个人中心 / 个人信息" onclick="loadPage(this)">
                <span class="menu-icon">👤</span> 个人信息
            </div>
            <div class="menu-item" data-url="/admin-basic-data.html" data-title="教务设置 / 基础数据" onclick="loadPage(this)">
                <span class="menu-icon">🏫</span> 院系专业
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="breadcrumb" id="breadcrumb">系统概览 / 数据看板</div>
            <div class="header-right">
                <div class="user-profile">
                    <div class="avatar-small" id="headerAvatar">?</div>
                    <span id="headerName">加载中...</span>
                </div>
                <button class="btn-logout" onclick="logout()">退出登录</button>
            </div>
        </header>

        <div class="iframe-container">
            <iframe id="mainFrame" src="/admin-home-content.html"></iframe>
        </div>
    </main>
</div>

<script>
    const token = localStorage.getItem('token');
    const role = (localStorage.getItem('role') || '').replace('ROLE_', '');

    if (!token) {
        window.location.href = '/login.html';
    } else if (role !== 'ADMIN') {
        alert('无权访问管理控制台');
        localStorage.clear();
        window.location.href = '/login.html';
    }

    function loadPage(element) {
        document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        const url = element.getAttribute('data-url');
        const title = element.getAttribute('data-title');
        document.getElementById('mainFrame').src = url;
        document.getElementById('breadcrumb').innerText = title;
    }

    fetch('/user/info', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(res => res.json())
        .then(data => {
            const name = data.realName || data.username;
            document.getElementById('headerAvatar').innerText = name.charAt(0);
            document.getElementById('headerName').innerText = name;
        })
        .catch(() => { alert('登录已过期'); localStorage.clear(); window.location.href = '/login.html'; });

    function logout() { localStorage.clear(); window.location.href = '/login.html'; }
</script>
</body>
</html>
