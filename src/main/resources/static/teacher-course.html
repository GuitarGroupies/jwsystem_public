<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei"; background: transparent; padding: 30px; color: #1f2937; }
        .summary {
            background: #fff; border-radius: 12px; padding: 24px; display: flex; gap: 40px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px;
        }
        .summary-item { flex: 1; border-right: 1px solid #f3f4f6; padding-left: 10px;}
        .summary-item:last-child { border-right: none; }
        .summary-item .label { color: #6b7280; font-size: 14px; margin-bottom: 8px; }
        .summary-item .value { color: #10b981; font-size: 28px; font-weight: 700; }
        .summary-item .value small { font-size: 14px; color: #6b7280; font-weight: 400; margin-left: 4px; }

        .course-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .course-card {
            background: #fff; border-radius: 12px; padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 4px solid #10b981;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .course-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .course-card .course-name { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;}

        /* ✅ 新增：类型标签 */
        .tag-type { font-size: 12px; padding: 2px 8px; border-radius: 4px; font-weight: normal; }
        .type-必修 { background: #eff6ff; color: #3b82f6; }
        .type-选修 { background: #f3f4f6; color: #4b5563; }

        .info-row { display: flex; justify-content: space-between; font-size: 14px; color: #6b7280; margin-bottom: 10px; }
        .info-row .val { color: #1f2937; font-weight: 600; }
        .progress-bar { height: 8px; background: #f3f4f6; border-radius: 4px; overflow: hidden; margin: 16px 0; }
        .progress-inner { height: 100%; background: linear-gradient(90deg, #10b981, #6ee7b7); border-radius: 4px; }
        .actions { display: flex; gap: 12px; margin-top: 20px; }
        .actions .action-btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; text-decoration: none; transition: all 0.2s;
        }
        .btn-view { background: #ecfdf5; color: #10b981; }
        .btn-view:hover { background: #d1fae5; }
        .btn-grade { background: #10b981; color: #fff; }
        .btn-grade:hover { background: #059669; }
        .empty-tip { text-align: center; padding: 60px; color: #9ca3af; background: #fff; border-radius: 12px; margin-top: 20px; }
    </style>
</head>
<body>
<div class="summary" id="summary" style="display:none;">
    <div class="summary-item"><div class="label">授课门数</div><div class="value" id="courseCount">0<small>门</small></div></div>
    <div class="summary-item"><div class="label">总学分</div><div class="value" id="totalCredit">0<small>分</small></div></div>
    <div class="summary-item"><div class="label">总学生人数</div><div class="value" id="totalStudents">0<small>人</small></div></div>
</div>
<div class="course-list" id="courseList"></div>
<div class="empty-tip" id="emptyTip" style="display:none;">😶 你目前没有授课任务</div>
<script>
    const token = localStorage.getItem('token');
    async function request(url, options = {}) {
        const res = await fetch(url, { ...options, headers: { 'Authorization': 'Bearer ' + token, ...(options.headers || {}) } });
        if (!res.ok) throw new Error('服务器错误');
        return res.json();
    }
    async function loadCourses() {
        try {
            const courses = await request('/teacher/courses');
            if (!courses || courses.length === 0) { document.getElementById('emptyTip').style.display = 'block'; return; }
            document.getElementById('summary').style.display = 'flex';
            let totalCredit = 0, totalStudents = 0;
            courses.forEach(c => { totalCredit += (c.credit || 0); totalStudents += (c.selectedCount || 0); });
            document.getElementById('courseCount').innerHTML = courses.length + '<small>门</small>';
            document.getElementById('totalCredit').innerHTML = totalCredit + '<small>分</small>';
            document.getElementById('totalStudents').innerHTML = totalStudents + '<small>人</small>';
            const list = document.getElementById('courseList'); list.innerHTML = '';

            courses.forEach(c => {
                const selected = c.selectedCount || 0, capacity = c.capacity || 1;
                const percent = Math.min(100, Math.round(selected / capacity * 100));
                const targetUrl = '/teacher-grade.html?courseId=' + c.id + '&courseName=' + encodeURIComponent(c.courseName);
                const typeClass = c.courseType === '必修' ? 'type-必修' : 'type-选修';

                list.innerHTML += `
                    <div class="course-card">
                        <div class="course-name">
                            ${c.courseName}
                            <span class="tag-type ${typeClass}">${c.courseType || '选修'}</span> <!-- ✅ 新增 -->
                            ${selected >= capacity ? '<span style="font-size:12px;color:#ef4444;font-weight:normal;">(已满)</span>' : ''}
                        </div>
                        <div class="info-row"><span>课程 ID</span><span class="val">#${c.id}</span></div>
                        <div class="info-row"><span>学分</span><span class="val">${c.credit} 分</span></div>
                        <div class="info-row"><span>选课人数</span><span class="val">${selected} / ${capacity} 人</span></div>
                        <div class="progress-bar"><div class="progress-inner" style="width: ${percent}%"></div></div>
                        <div class="actions">
                            <a class="action-btn btn-view" href="${targetUrl}">👥 本课名单</a>
                            <a class="action-btn btn-grade" href="${targetUrl}">✏️ 录入成绩</a>
                        </div>
                    </div>`;
            });
        } catch (e) { console.error(e); }
    }
    loadCourses();
</script>
</body>
</html>
