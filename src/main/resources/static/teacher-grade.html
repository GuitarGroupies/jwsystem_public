<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei"; background: transparent; padding: 30px; color: #1f2937; }

        /* 顶部操作栏 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .btn-back {
            background: #fff; color: #10b981; border: 1px solid #10b981;
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 500; transition: all 0.2s;
        }
        .btn-back:hover { background: #ecfdf5; }

        /* 统计与搜索栏 */
        .summary-wrap { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
        .summary { background: #fff; border-radius: 12px; padding: 24px; display: flex; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); flex: 2; }
        .summary-item { flex: 1; text-align: center; border-right: 1px solid #f3f4f6; }
        .summary-item:last-child { border: none; }
        .summary-item .label { color: #6b7280; font-size: 13px; margin-bottom: 8px; }
        .summary-item .value { color: #10b981; font-size: 24px; font-weight: 600; }
        .summary-item .value small { font-size: 14px; color: #6b7280; margin-left: 4px; }

        /* ✅ 新增：搜索框样式 */
        .search-box {
            flex: 1; background: #fff; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 0 20px;
            display: flex; align-items: center; height: 100%; min-height: 88px;
        }
        .search-box input { width: 100%; border: none; outline: none; font-size: 15px; background: transparent; }
        .search-icon { color: #9ca3af; font-size: 18px; margin-right: 10px; }

        /* 手风琴容器 */
        .accordion { margin-bottom: 16px; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
        .acc-header { padding: 16px 24px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 16px; transition: background 0.2s; background: #fafafa; border-bottom: 1px solid #f3f4f6; }
        .acc-header:hover { background: #f3f4f6; }
        .acc-header.active { background: #ecfdf5; color: #10b981; }
        .acc-header .arrow { transition: transform 0.3s; font-size: 12px; color: #9ca3af; }
        .acc-header.active .arrow { transform: rotate(180deg); color: #10b981; }
        .acc-body { display: none; padding: 0; }
        .acc-body.show { display: block; }
        .class-panel { border-top: 1px solid #f3f4f6; }
        .class-panel:first-child { border-top: none; }
        .class-header { padding: 14px 24px 14px 40px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 500; font-size: 15px; background: #fff; transition: background 0.2s;}
        .class-header:hover { background: #f9fafb; }

        /* 表格 */
        table { width: 100%; border-collapse: collapse; text-align: left; background: #fff; }
        th { background: #f9fafb; color: #6b7280; font-size: 13px; font-weight: 600; padding: 12px 24px 12px 56px; border-bottom: 1px solid #e5e7eb; }
        td { padding: 12px 24px 12px 56px; border-bottom: 1px solid #f3f4f6; font-size: 14px; }

        /* 搜索结果表格（不需要缩进） */
        .search-result-table th, .search-result-table td { padding: 16px 24px; }

        .score-input { width: 80px; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; text-align: center; }
        .score-input:focus { border-color: #10b981; outline: none; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
        .btn-save { padding: 6px 16px; background: #10b981; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;}
        .btn-save:hover { background: #059669; }
        .btn-save:disabled { background: #a7f3d0; cursor: not-allowed; }
        .btn-remove { padding: 6px 12px; background: transparent; color: #ef4444; border: 1px solid #fecaca; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 8px;}
        .btn-remove:hover { background: #fef2f2; }

        .empty-tip { text-align: center; padding: 60px; color: #9ca3af; background: #fff; border-radius: 12px; }
    </style>
</head>
<body>

<div class="top-bar">
    <button class="btn-back" onclick="window.location.href='/teacher-course.html'">← 返回我的课程</button>
</div>

<div class="summary-wrap" id="summaryWrap" style="display:none;">
    <div class="summary">
        <div class="summary-item"><div class="label">当前课程</div><div class="value" id="courseName" style="color:#1f2937;">-</div></div>
        <div class="summary-item"><div class="label">选课总人数</div><div class="value" id="studentCount">0<small>人</small></div></div>
        <div class="summary-item"><div class="label">已录入成绩</div><div class="value" id="gradedCount">0<small>人</small></div></div>
    </div>
    <!-- ✅ 新增：搜索框 -->
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="输入学号或姓名搜索..." oninput="handleSearch()">
    </div>
</div>

<div id="courseDataContainer"></div>

<div class="empty-tip" id="emptyTip" style="display:none;">😶 暂无学生数据或未搜索到结果</div>

<script>
    const token = localStorage.getItem('token');
    const params = new URLSearchParams(window.location.search);
    const courseId = params.get('courseId');
    const courseName = params.get('courseName');

    if (!courseId) window.location.href = '/teacher-course.html';
    document.getElementById('courseName').innerText = courseName || '未知课程';

    let allStudentsData = []; // 缓存全量数据，方便搜索

    async function request(url, options = {}) {
        const res = await fetch(url, { ...options, headers: { 'Authorization': 'Bearer ' + token, ...(options.headers || {}) } });
        if (!res.ok) throw new Error('服务器错误');
        return res.json();
    }

    async function loadStudents() {
        try {
            const students = await request('/teacher/students?courseId=' + courseId);
            document.getElementById('summaryWrap').style.display = 'flex';

            if (!students || students.length === 0) {
                document.getElementById('emptyTip').style.display = 'block';
                document.getElementById('courseDataContainer').innerHTML = '';
                return;
            }

            allStudentsData = students;
            let graded = 0;
            allStudentsData.forEach(s => {
                if (s.score !== null && s.score !== undefined) graded++;
            });

            document.getElementById('studentCount').innerHTML = allStudentsData.length + '<small>人</small>';
            document.getElementById('gradedCount').innerHTML = graded + '<small>人</small>';

            // 初始渲染：带折叠面板的视图
            renderAccordionView(allStudentsData);

        } catch (e) { console.error(e); }
    }

    // ✅ 新增：搜索触发逻辑
    function handleSearch() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

        if (!keyword) {
            // 如果清空了搜索，恢复折叠视图
            renderAccordionView(allStudentsData);
            return;
        }

        // 过滤数据（学号或姓名匹配）
        const filtered = allStudentsData.filter(s =>
            s.studentUsername.toLowerCase().includes(keyword) ||
            s.studentName.toLowerCase().includes(keyword)
        );

        renderSearchView(filtered);
    }

    // ✅ 渲染搜索结果（平铺表格）
    function renderSearchView(students) {
        const container = document.getElementById('courseDataContainer');
        container.innerHTML = '';

        if (students.length === 0) {
            document.getElementById('emptyTip').style.display = 'block';
            return;
        }
        document.getElementById('emptyTip').style.display = 'none';

        let html = `
            <div class="accordion" style="display:block;">
                <table class="search-result-table">
                    <thead><tr><th width="80">学号</th><th>姓名</th><th>所属班级</th><th>当前成绩</th><th>操作</th></tr></thead>
                    <tbody>
        `;

        students.forEach(s => {
            const hasScore = s.score !== null && s.score !== undefined;
            const scoreVal = hasScore ? parseFloat(s.score) : '';
            const inputId = `input-search-${s.studentId}`;

            html += `
                <tr>
                    <td style="color:#6b7280;font-family:monospace;">${s.studentUsername}</td>
                    <td style="font-weight:500;">${s.studentName}</td>
                    <td><span style="background:#f3f4f6; color:#4b5563; padding:2px 8px; border-radius:4px; font-size:12px;">${s.className || '未分配'}</span></td>
                    <td><input type="number" class="score-input" id="${inputId}" value="${scoreVal}" min="0" max="100" step="0.1" placeholder="未录入"></td>
                    <td>
                        <button class="btn-save" onclick="saveScore(${s.studentId}, '${inputId}', this)">保存</button>
                        <button class="btn-remove" onclick="removeStudent(${s.studentId}, '${s.studentName}')">移出</button>
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table></div>`;
        container.innerHTML = html;
    }

    // 原有的折叠面板渲染逻辑
    function renderAccordionView(students) {
        const container = document.getElementById('courseDataContainer');
        container.innerHTML = '';
        if (students.length === 0) return;

        const groups = {};
        students.forEach(s => {
            const deptName = s.department || '未分配院系';
            const className = s.className || '未分配班级';
            if (!groups[deptName]) groups[deptName] = {};
            if (!groups[deptName][className]) groups[deptName][className] = [];
            groups[deptName][className].push(s);
        });

        let deptIndex = 0;
        for (const deptName in groups) {
            deptIndex++;
            const deptId = 'dept-' + deptIndex;
            let deptHtml = `
            <div class="accordion">
                <div class="acc-header" onclick="toggleAcc('${deptId}', this)">
                    <span>🏢 ${deptName} <span style="font-size:12px; color:#9ca3af; font-weight:normal; margin-left:8px;">(共 ${Object.values(groups[deptName]).flat().length} 人)</span></span>
                    <span class="arrow">▼</span>
                </div>
                <div class="acc-body" id="${deptId}">
            `;

            let classIndex = 0;
            for (const className in groups[deptName]) {
                classIndex++;
                const classId = 'class-' + deptIndex + '-' + classIndex;
                const classStudents = groups[deptName][className];

                deptHtml += `
                    <div class="class-panel">
                        <div class="class-header" onclick="toggleAcc('${classId}', this)">
                            <span>👨‍🎓 ${className} <span style="font-size:12px; color:#9ca3af; font-weight:normal; margin-left:8px;">(${classStudents.length} 人)</span></span>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="acc-body" id="${classId}">
                            <table>
                                <thead><tr><th width="80">学号</th><th>姓名</th><th>当前成绩</th><th>操作</th></tr></thead>
                                <tbody>
                `;

                classStudents.forEach(s => {
                    const hasScore = s.score !== null && s.score !== undefined;
                    const scoreVal = hasScore ? parseFloat(s.score) : '';
                    const inputId = `input-${s.studentId}`;
                    deptHtml += `
                        <tr>
                            <td style="color:#6b7280;font-family:monospace;">${s.studentUsername}</td>
                            <td style="font-weight:500;">${s.studentName}</td>
                            <td><input type="number" class="score-input" id="${inputId}" value="${scoreVal}" min="0" max="100" step="0.1" placeholder="未录入"></td>
                            <td>
                                <button class="btn-save" onclick="saveScore(${s.studentId}, '${inputId}', this)">保存</button>
                                <button class="btn-remove" onclick="removeStudent(${s.studentId}, '${s.studentName}')">移出</button>
                            </td>
                        </tr>
                    `;
                });
                deptHtml += `</tbody></table></div></div>`;
            }
            deptHtml += `</div></div>`;
            container.innerHTML += deptHtml;
        }
    }

    function toggleAcc(id, headerElement) {
        const body = document.getElementById(id);
        if (body.style.display === 'block') {
            body.style.display = 'none';
            headerElement.classList.remove('active');
        } else {
            body.style.display = 'block';
            headerElement.classList.add('active');
        }
    }

    async function saveScore(studentId, inputId, btnObj) {
        const input = document.getElementById(inputId);
        const val = input.value.trim();
        if (val === '') return alert('请输入成绩');
        const scoreNum = parseFloat(val);
        if (isNaN(scoreNum) || scoreNum < 0 || scoreNum > 100) return alert('成绩必须在 0-100 之间');

        btnObj.disabled = true; btnObj.innerText = '保存中...';
        try {
            const res = await request('/teacher/grade', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ studentId, courseId, score: scoreNum })
            });
            if (res.success) {
                btnObj.innerText = '已保存';
                btnObj.style.background = '#a7f3d0';
                setTimeout(() => loadStudents(), 500); // 刷新数据
            } else {
                alert(res.message); btnObj.disabled = false; btnObj.innerText = '保存';
            }
        } catch (e) { alert('保存失败'); btnObj.disabled = false; btnObj.innerText = '保存'; }
    }

    async function removeStudent(studentId, name) {
        if (!confirm(`确定要将【${name}】从当前这门课中移出吗？`)) return;
        try {
            const res = await request('/teacher/remove-student-from-course', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ studentId, courseId })
            });
            alert(res.message);
            if (res.success) {
                loadStudents(); // 刷新数据
            }
        } catch (e) { alert('操作失败'); }
    }

    loadStudents();
</script>
</body>
</html>
