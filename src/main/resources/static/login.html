<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>教务系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 420px;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        .login-box .subtitle {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .form-item { margin-bottom: 20px; }
        .form-item label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }
        .form-item input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }
        .form-item input:focus { border-color: #667eea; }

        .captcha-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .captcha-row input { flex: 1; }
        .captcha-row img {
            width: 120px;
            height: 44px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button.login-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button.login-btn:hover { background: #5568d3; }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }
        .message.error { color: #ff4d4f; }
        .message.success { color: #52c41a; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>教务系统登录</h2>
    <div class="subtitle">请输入账号密码，系统自动识别身份</div>

    <div class="form-item">
        <label>账号</label>
        <input type="text" id="username" placeholder="学号 / 工号 / 管理员账号">
    </div>

    <div class="form-item">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>

    <div class="form-item">
        <label>验证码</label>
        <div class="captcha-row">
            <input type="text" id="captcha" placeholder="请输入验证码">
            <img id="captchaImg" src="" alt="验证码" title="点击刷新">
        </div>
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>

    <div class="message" id="message"></div>
</div>

<script>
    const API = 'http://localhost:8080';
    let currentKey = '';

    // 加载验证码
    async function loadCaptcha() {
        try {
            const res = await fetch(`${API}/captcha`);
            const data = await res.json();
            currentKey = data.key;
            document.getElementById('captchaImg').src = data.image;
        } catch (e) {
            console.error('加载验证码失败', e);
        }
    }

    document.getElementById('captchaImg').onclick = loadCaptcha;

    // 登录
    async function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const captcha = document.getElementById('captcha').value.trim();
        const msg = document.getElementById('message');

        if (!username || !password || !captcha) {
            msg.className = 'message error';
            msg.innerText = '请填写完整信息';
            return;
        }

        try {
            const res = await fetch(`${API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, captcha, key: currentKey })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('username', data.username);

                msg.className = 'message success';
                msg.innerText = '登录成功，正在跳转...';

                // ✅ 去掉 ROLE_ 前缀，统一处理
                const role = (data.role || '').replace('ROLE_', '');

                setTimeout(() => {
                    if (role === 'STUDENT') {
                        window.location.href = '/student.html';
                    } else if (role === 'TEACHER') {
                        window.location.href = '/teacher.html';
                    } else if (role === 'ADMIN') {
                        window.location.href = '/admin.html';
                    } else {
                        alert('未知角色：' + data.role);
                        localStorage.clear();
                    }
                }, 500);

            } else {
                msg.className = 'message error';
                msg.innerText = data.message || '登录失败';
                loadCaptcha();
                document.getElementById('captcha').value = '';
            }
        } catch (e) {
            msg.className = 'message error';
            msg.innerText = '请求失败：' + e.message;
        }
    }

    document.getElementById('password').onkeydown = (e) => {
        if (e.key === 'Enter') doLogin();
    };

    loadCaptcha();
</script>

</body>
</html>
