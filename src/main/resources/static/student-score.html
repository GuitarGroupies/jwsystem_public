<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei"; background: transparent; padding: 30px; color: #1f2937; }

        .summary { background: #fff; border-radius: 12px; padding: 24px; display: flex; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px; }
        .summary-item { flex: 1; text-align: center; border-right: 1px solid #f3f4f6; }
        .summary-item:last-child { border-right: none; }
        .summary-item .label { color: #6b7280; font-size: 14px; margin-bottom: 8px; }
        .summary-item .value { color: #3b82f6; font-size: 28px; font-weight: 700; }
        .summary-item .value small { font-size: 14px; color: #6b7280; font-weight: 400; margin-left: 4px; }

        .table-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f9fafb; color: #6b7280; font-weight: 600; font-size: 13px; padding: 16px 24px; border-bottom: 1px solid #e5e7eb; }
        td { padding: 16px 24px; border-bottom: 1px solid #f3f4f6; font-size: 15px; }
        tbody tr:hover { background-color: #f9fafb; }

        .score-num { font-weight: 700; font-size: 16px; }
        .score-pass { color: #10b981; }
        .score-fail { color: #ef4444; }
        .tag { display: inline-block; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .tag-pass { background: #ecfdf5; color: #10b981; }
        .tag-fail { background: #fef2f2; color: #ef4444; }
        .empty-tip { text-align: center; padding: 60px; color: #9ca3af; background: #fff; border-radius: 12px; }
    </style>
</head>
<body>

<div class="summary" id="summary" style="display:none;">
    <div class="summary-item"><div class="label">已修课程</div><div class="value" id="courseCount">0<small>门</small></div></div>
    <div class="summary-item"><div class="label">平均分</div><div class="value" id="avgScore">0<small>分</small></div></div>
    <div class="summary-item"><div class="label">最高分</div><div class="value" id="maxScore">0<small>分</small></div></div>
    <div class="summary-item"><div class="label">已获学分</div><div class="value" id="totalCredit">0<small>分</small></div></div>
</div>

<div class="table-container" id="tableWrap" style="display:none;">
    <table>
        <thead><tr><th>课程名</th><th>教师</th><th>学分</th><th>分数</th><th>状态</th></tr></thead>
        <tbody id="scoreTable"></tbody>
    </table>
</div>

<div class="empty-tip" id="emptyTip" style="display:none;">😶 你还没有任何成绩记录</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) { window.top.location.href = '/login.html'; }

    async function request(url) {
        const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
        if (res.status === 401 || res.status === 403) {
            localStorage.clear(); window.top.location.href = '/login.html'; throw new Error('未授权');
        }
        if (!res.ok) throw new Error('服务器错误');
        return res.json();
    }

    async function loadScores() {
        try {
            const scores = await request('/score/my');
            if (!scores || scores.length === 0) { document.getElementById('emptyTip').style.display = 'block'; return; }

            document.getElementById('summary').style.display = 'flex';
            document.getElementById('tableWrap').style.display = 'block';

            let total = 0, maxScore = 0, totalCredit = 0;
            scores.forEach(s => {
                const sc = parseFloat(s.score); total += sc;
                if (sc > maxScore) maxScore = sc;
                if (sc >= 60) totalCredit += (s.credit || 0);
            });
            const avg = (total / scores.length).toFixed(1);

            document.getElementById('courseCount').innerHTML = scores.length + '<small>门</small>';
            document.getElementById('avgScore').innerHTML = avg + '<small>分</small>';
            document.getElementById('maxScore').innerHTML = maxScore + '<small>分</small>';
            document.getElementById('totalCredit').innerHTML = totalCredit + '<small>分</small>';

            const tbody = document.getElementById('scoreTable'); tbody.innerHTML = '';
            scores.forEach(s => {
                const sc = parseFloat(s.score); const pass = sc >= 60;
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: 500;">${s.courseName}</td>
                        <td>${s.teacherName || '-'}</td>
                        <td>${s.credit}</td>
                        <td class="score-num ${pass ? 'score-pass' : 'score-fail'}">${sc}</td>
                        <td><span class="tag ${pass ? 'tag-pass' : 'tag-fail'}">${pass ? '及格' : '不及格'}</span></td>
                    </tr>`;
            });
        } catch (e) { console.error(e); }
    }
    loadScores();
</script>
</body>
</html>
