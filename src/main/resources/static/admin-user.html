<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei"; background: transparent; padding: 30px; color: #1f2937; }

        /* 顶部区域（面包屑和返回按钮） */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .breadcrumb { font-size: 15px; color: #6b7280; display: flex; align-items: center; gap: 8px; }
        .breadcrumb span { cursor: pointer; color: #8b5cf6; font-weight: 500; transition: color 0.2s; }
        .breadcrumb span:hover { color: #6d28d9; text-decoration: underline; }
        .breadcrumb .current { color: #1f2937; cursor: default; text-decoration: none; font-weight: 600; }

        .btn-back { background: #fff; color: #6b7280; border: 1px solid #e5e7eb; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; display: none; transition: all 0.2s; }
        .btn-back:hover { background: #f3f4f6; color: #1f2937; }

        .panel { display: none; animation: fadeIn 0.3s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 标题 */
        .section-title { font-size: 16px; font-weight: 600; margin: 24px 0 15px; color: #374151; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; display: inline-block; width: 4px; height: 16px; background: #8b5cf6; border-radius: 2px; }

        /* 卡片网格 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }

        /* 院系和班级卡片 */
        .card {
            background: #fff; border-radius: 12px; padding: 20px 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); cursor: pointer;
            transition: all 0.2s; border-left: 4px solid #8b5cf6;
            display: flex; justify-content: space-between; align-items: center;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); background: #faf5ff; }
        .card .title { font-size: 16px; font-weight: 600; }
        .card .arrow { color: #d1d5db; font-size: 18px; }
        .card:hover .arrow { color: #8b5cf6; }

        /* 老师卡片 */
        .teacher-card {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 4px solid #10b981;
            display: flex; align-items: center; gap: 15px;
        }
        .teacher-avatar {
            width: 44px; height: 44px; border-radius: 50%; background: #ecfdf5;
            color: #10b981; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px;
        }
        .teacher-info .name { font-weight: 600; font-size: 16px; color: #1f2937; margin-bottom: 4px; }
        .teacher-info .id { font-size: 13px; color: #6b7280; font-family: monospace; }

        /* 表格 */
        .table-container { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f9fafb; color: #6b7280; font-weight: 600; font-size: 13px; padding: 16px 24px; border-bottom: 1px solid #e5e7eb; }
        td { padding: 16px 24px; border-bottom: 1px solid #f3f4f6; font-size: 15px; }
        tbody tr:hover { background-color: #f9fafb; }

        .btn-reset { background: transparent; color: #f59e0b; border: 1px solid #fde68a; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s;}
        .btn-reset:hover { background: #fffbeb; }
        .empty-tip { text-align: center; padding: 40px; color: #9ca3af; background: #fff; border-radius: 12px; font-size: 14px; }
    </style>
</head>
<body>

<!-- 顶部操作栏 -->
<div class="top-bar">
    <div class="breadcrumb" id="breadcrumb">
        <span class="current">全部院系</span>
    </div>
    <button class="btn-back" id="btnBack" onclick="handleBack()">← 返回上一级</button>
</div>

<!-- 视图 1：院系列表 -->
<div id="panel-dept" class="panel active">
    <div class="grid" id="deptList"></div>
</div>

<!-- 视图 2：院系详情（包含老师和班级） -->
<div id="panel-dept-detail" class="panel">
    <div class="section-title">本院系教师</div>
    <div class="grid" id="teacherList"></div>

    <div class="section-title" style="margin-top: 32px;">本院系班级</div>
    <div class="grid" id="classList"></div>
</div>

<!-- 视图 3：班级学生详情 -->
<div id="panel-student" class="panel">
    <div class="table-container" id="studentTableWrap" style="display:none;">
        <table>
            <thead>
            <tr><th width="80">序号</th><th>学号</th><th>姓名</th><th>角色</th><th width="120">操作</th></tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>
    <div class="empty-tip" id="studentEmpty" style="display:none;">该班级下暂无学生</div>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) { window.top.location.href = '/login.html'; }

    let currentDept = null;
    let currentClass = null;

    async function request(url, options = {}) {
        const res = await fetch(url, { ...options, headers: { 'Authorization': 'Bearer ' + token, ...(options.headers || {}) } });
        if (!res.ok) throw new Error('服务器错误');
        return res.json();
    }

    function showPanel(panelId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(panelId).classList.add('active');
    }

    // 更新面包屑和返回按钮状态
    function updateNav() {
        const btnBack = document.getElementById('btnBack');
        let html = '';

        if (!currentDept) {
            html = `<span class="current">全部院系</span>`;
            btnBack.style.display = 'none'; // 顶级页面隐藏返回按钮
        } else if (currentDept && !currentClass) {
            html = `<span onclick="loadDepts()">全部院系</span> / <span class="current">${currentDept.deptName}</span>`;
            btnBack.style.display = 'block'; // 显示返回按钮
        } else {
            html = `<span onclick="loadDepts()">全部院系</span> / <span onclick="clickDept(currentDept)">${currentDept.deptName}</span> / <span class="current">${currentClass.className}</span>`;
            btnBack.style.display = 'block';
        }
        document.getElementById('breadcrumb').innerHTML = html;
    }

    // 处理返回按钮点击
    function handleBack() {
        if (currentClass) {
            // 如果当前在学生列表，退回到班级列表
            currentClass = null;
            clickDept(currentDept);
        } else if (currentDept) {
            // 如果当前在班级列表，退回到院系列表
            loadDepts();
        }
    }

    // 1. 加载全部院系
    async function loadDepts() {
        currentDept = null; currentClass = null;
        updateNav();
        showPanel('panel-dept');

        const depts = await request('/admin/depts');
        const list = document.getElementById('deptList');
        list.innerHTML = depts.map(d => `
            <div class="card" onclick='clickDept(${JSON.stringify(d)})'>
                <div class="title">🏢 ${d.deptName}</div>
                <div class="arrow">›</div>
            </div>
        `).join('');
    }

    // 2. 点击院系：加载老师和班级
    async function clickDept(dept) {
        currentDept = dept;
        currentClass = null;
        updateNav();
        showPanel('panel-dept-detail');

        // 渲染老师
        try {
            const teachers = await request('/admin/teachers/by-dept?deptId=' + dept.id);
            const tList = document.getElementById('teacherList');
            if(teachers.length === 0) {
                tList.innerHTML = '<div class="empty-tip">该院系暂无教师</div>';
            } else {
                tList.innerHTML = teachers.map(t => `
                    <div class="teacher-card">
                        <div class="teacher-avatar">${t.realName.charAt(0)}</div>
                        <div class="teacher-info">
                            <div class="name">${t.realName}</div>
                            <div class="id">工号: ${t.username}</div>
                        </div>
                    </div>
                `).join('');
            }
        } catch (e) { console.error("加载老师失败", e); }

        // 渲染班级
        try {
            const classes = await request('/admin/classes/by-dept?deptId=' + dept.id);
            const cList = document.getElementById('classList');
            if(classes.length === 0) {
                cList.innerHTML = '<div class="empty-tip">该院系暂无班级</div>';
            } else {
                cList.innerHTML = classes.map(c => `
                    <div class="card" onclick='clickClass(${JSON.stringify(c)})'>
                        <div class="title">👨‍🎓 ${c.className}</div>
                        <div class="arrow">›</div>
                    </div>
                `).join('');
            }
        } catch (e) { console.error("加载班级失败", e); }
    }

    // 3. 点击班级：加载学生
    async function clickClass(sysClass) {
        currentClass = sysClass;
        updateNav();
        showPanel('panel-student');

        const students = await request('/admin/students/by-class?classId=' + sysClass.id);
        const tbody = document.getElementById('studentTable');
        const tableWrap = document.getElementById('studentTableWrap');
        const emptyTip = document.getElementById('studentEmpty');

        if (students.length === 0) {
            tableWrap.style.display = 'none'; emptyTip.style.display = 'block'; return;
        }
        tableWrap.style.display = 'block'; emptyTip.style.display = 'none';

        tbody.innerHTML = '';
        students.forEach((s, i) => {
            tbody.innerHTML += `
                <tr>
                    <td style="color: #9ca3af;">${i + 1}</td>
                    <td style="font-family: monospace; color: #6b7280;">${s.username}</td>
                    <td style="font-weight: 500;">${s.realName}</td>
                    <td><span style="background: #eff6ff; color: #3b82f6; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600;">学生</span></td>
                    <td><button class="btn-reset" onclick="resetPassword(${s.id}, '${s.realName}')">重置密码</button></td>
                </tr>`;
        });
    }

    // 重置密码
    async function resetPassword(id, name) {
        if (!confirm(`确定要将【${name}】的密码重置为 123456 吗？`)) return;
        try {
            const data = await request('/admin/reset-password/' + id, { method: 'POST' });
            alert(data.message);
        } catch (e) { alert('操作失败'); }
    }

    // 初始化
    loadDepts();
</script>
</body>
</html>
